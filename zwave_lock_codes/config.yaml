name: Z-Wave Lock Codes
version: "0.3.0"
slug: zwave_lock_codes
description: Manage Z-Wave lock user codes from one table, synced to your locks on save
url: https://github.com/wrcrooks/ZWaveLockCodes
arch:
  - aarch64
  - amd64
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:lock-smart
panel_title: Lock Codes
homeassistant_api: true
options:
  locks: []
  log_level: info
schema:
  locks:
    - match(^lock\.[a-z0-9_]+$)
  # Single-lock setting from before 0.3.0; still read so upgrades keep their lock.
  lock_entity: match(^lock\.[a-z0-9_]+$)?
  log_level: list(debug|info|warning|error)
