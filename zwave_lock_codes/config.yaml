name: Z-Wave Lock Codes
version: "0.1.0"
slug: zwave_lock_codes
description: Manage Z-Wave lock user codes from a table, synced to the lock on save
url: https://github.com/wrcrooks/ZWaveLockCodes
arch:
  - aarch64
  - amd64
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:lock-smart
panel_title: Lock Codes
homeassistant_api: true
options:
  lock_entity: lock.front_door
  log_level: info
schema:
  lock_entity: match(^lock\.[a-z0-9_]+$)
  log_level: list(debug|info|warning|error)
