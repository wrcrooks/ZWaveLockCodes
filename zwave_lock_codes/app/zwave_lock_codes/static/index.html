<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock Codes</title>
<style>
  :root {
    --bg: #fafafa; --card: #fff; --text: #1c1c1c; --muted: #6b6b6b; --line: #e3e3e3;
    --accent: #03a9f4; --ok: #2e7d32; --warn: #b26a00; --err: #c62828; --input: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b; --line: #333;
      --accent: #4fc3f7; --ok: #81c784; --warn: #ffb74d; --err: #ef9a9a; --input: #262626;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .lock { color: var(--muted); }
  .spacer { flex: 1; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: 0; }
  input[type=text], input[type=number], input[type=password] {
    font: inherit; width: 100%; min-width: 60px; padding: 4px 6px; border: 1px solid var(--line);
    border-radius: 4px; background: var(--input); color: var(--text); }
  input.slot { width: 64px; }
  input.pin { width: 110px; font-variant-numeric: tabular-nums; }
  tr.deleted td { opacity: .55; text-decoration: line-through; }
  tr.invalid input { border-color: var(--err); }
  .err { color: var(--err); font-size: 12px; }
  .locks { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
  .locks label { display: inline-flex; gap: 6px; align-items: center; }
  .statuses { display: flex; flex-direction: column; gap: 3px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap;
          border: 1px solid currentColor; }
  .synced { color: var(--ok); } .unverified { color: var(--ok); border-style: dashed; }
  .pending, .writing, .skipped { color: var(--warn); } .error { color: var(--err); }
  .msg { color: var(--muted); font-size: 12px; }
  .banner { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--err); color: var(--err); }
  .banner.note { border-color: var(--line); color: var(--text); background: var(--card); }
  .banner:empty { display: none; }
  .banner ul { margin: 4px 0 0; padding-left: 20px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  details.config { margin-bottom: 12px; }
  details.config > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; list-style-position: inside; }
  details.config[open] > summary { border-bottom: 1px solid var(--line); }
  .config-body { padding: 4px 14px 12px; }
  .picker { display: flex; gap: 8px; align-items: center; padding: 10px 0 4px; }
  .setting { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 0;
             border-bottom: 1px solid var(--line); }
  .setting:last-child { border-bottom: 0; }
  .setting .what { flex: 1 1 260px; }
  .setting .desc { color: var(--muted); font-size: 12px; }
  .setting .how { display: flex; gap: 8px; align-items: center; }
  select, .setting input { font: inherit; padding: 4px 6px; border: 1px solid var(--line);
                           border-radius: 4px; background: var(--input); color: var(--text); }
  .setting input { width: 90px; }
  .setting .note { font-size: 12px; min-width: 60px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 14px 0 2px; }
  .info { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 16px; }
  .info div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .info span:last-child { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lock Codes</h1>
    <span class="lock" id="lock"></span>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="reveal"> Show PINs</label>
    <button id="import" title="Add codes already on the locks to the table">Import from locks</button>
    <button id="retry" title="Try failed or pending slots again">Retry</button>
    <button id="add">Add code</button>
    <button id="discard" disabled>Discard</button>
    <button id="save" class="primary" disabled>Save &amp; sync</button>
  </header>
  <div class="banner" id="banner"></div>
  <div class="banner note" id="notice"></div>
  <details class="card config" id="config">
    <summary>Lock configuration</summary>
    <div class="config-body">
      <div class="picker" id="picker" hidden>
        <label for="config-lock" class="msg">Lock</label>
        <select id="config-lock"></select>
      </div>
      <div id="config-body"><p class="msg">Loading…</p></div>
    </div>
  </details>
  <div class="card">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let server = { rows: [], locks: [] };  // last state from the add-on
let draft = null;                      // the user's unsaved edits, or null
let errors = {};
let pollTimer = null;
let nextId = 0;

const LABELS = { synced: "Synced", unverified: "Synced (hidden)", pending: "Pending",
                 writing: "Writing…", error: "Error", skipped: "Not on lock" };

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" },
                                  body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.message || res.statusText), { data });
  return data;
}

function rows() { return draft ?? server.rows; }
function multi() { return server.locks.length > 1; }
function labelOf(entity) { return server.locks.find((l) => l.entity === entity)?.label ?? entity; }

function edit() {
  if (!draft) draft = server.rows.filter((r) => !r.deleted).map((r) => ({ ...r, locks: [...r.locks] }));
  $("save").disabled = $("discard").disabled = false;
  return draft;
}

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}

function pinHint(r) {
  if (r.pin === null) return "hidden on lock";
  const lengths = new Set(server.locks.filter((l) => r.locks.includes(l.entity) && l.pin_length).map((l) => l.pin_length));
  return lengths.size === 1 ? `${[...lengths][0]} digits` : "4–8 digits";
}

function statusCell(r) {
  const entries = Object.entries(r.status || {});
  if (!entries.length) return el("span", { className: "msg", textContent: draft ? "Unsaved" : "Not on any lock" });
  return el("div", { className: "statuses" }, ...entries.map(([lock, st]) => {
    const clearing = r.deleted || r.enabled === false || !r.locks.includes(lock);
    const text = clearing && ["pending", "writing"].includes(st.state)
      ? "Clearing" : LABELS[st.state] || st.state;
    return el("div", {},
      el("span", { className: `chip ${st.state}`, title: st.message || "",
                   textContent: multi() ? `${labelOf(lock)}: ${text}` : text }),
      st.message ? el("div", { className: "msg", textContent: st.message }) : "");
  }));
}

function render() {
  const names = server.locks.map((l) => l.label);
  $("lock").textContent = names.length ? names.join(" · ") : "";
  $("banner").textContent = !server.locks.length
    ? "No locks are set up yet. Add your lock entities on the add-on's Configuration tab, then restart it."
    : server.error ? `Last sync failed: ${server.error}` : "";
  $("head").replaceChildren(...["Slot", "Name", "PIN", "Enabled", ...(multi() ? ["Locks"] : []), "Notes", "Status", ""]
    .map((t) => el("th", { textContent: t })));
  const reveal = $("reveal").checked;
  const body = $("rows");
  body.replaceChildren();
  const list = rows();
  if (!list.length) {
    body.append(el("tr", {}, el("td", { colSpan: multi() ? 8 : 7, className: "empty",
      textContent: "No codes yet. Add one, or import what's already on your locks." })));
  }
  for (const r of list) {
    const tr = el("tr", { className: (r.deleted ? "deleted " : "") + (errors[r.slot] ? "invalid" : "") });
    const target = () => edit().find((x) => x._id === r._id);
    const bind = (input, key, conv = (v) => v) => {
      input.addEventListener("input", () => {
        target()[key] = conv(input.type === "checkbox" ? input.checked : input.value);
      });
      input.disabled = !!r.deleted;
      return input;
    };
    const slot = bind(el("input", { type: "number", className: "slot", min: 1, value: r.slot }), "slot", Number);
    const name = bind(el("input", { type: "text", value: r.name || "", maxLength: 64, placeholder: "Name" }), "name");
    const pin = bind(el("input", { type: reveal ? "text" : "password", className: "pin", value: r.pin ?? "",
                                   inputMode: "numeric", maxLength: 8, autocomplete: "off", placeholder: pinHint(r) }), "pin");
    const enabled = bind(el("input", { type: "checkbox", checked: r.enabled !== false }), "enabled");
    const notes = bind(el("input", { type: "text", value: r.notes || "", maxLength: 256 }), "notes");
    const cells = [el("td", {}, slot), el("td", {}, name), el("td", {}, pin), el("td", {}, enabled)];
    if (multi()) {
      cells.push(el("td", {}, el("div", { className: "locks" }, ...server.locks.map((l) => {
        const box = el("input", { type: "checkbox", checked: r.locks.includes(l.entity), disabled: !!r.deleted });
        box.addEventListener("change", () => {
          const t = target();
          t.locks = server.locks.map((x) => x.entity)
            .filter((e) => (e === l.entity ? box.checked : t.locks.includes(e)));
        });
        return el("label", {}, box, l.label);
      }))));
    }
    const del = el("button", { textContent: "Delete", disabled: !!r.deleted, title: "Remove and clear this slot on every lock" });
    del.addEventListener("click", () => { draft = edit().filter((x) => x._id !== r._id); render(); });
    cells.push(el("td", {}, notes),
               el("td", {}, statusCell(r), errors[r.slot] ? el("div", { className: "err", textContent: errors[r.slot] }) : ""),
               el("td", {}, del));
    tr.append(...cells);
    body.append(tr);
  }
  const states = server.rows.flatMap((r) => Object.values(r.status || {}).map((s) => s.state));
  $("retry").disabled = server.syncing || !states.some((s) => ["error", "pending"].includes(s));
  $("import").disabled = server.syncing || server.importing || !server.locks.length;
  $("add").disabled = !server.locks.length;
}

function showImport(report) {
  if (!report) return;
  const parts = [`Imported ${report.added} new code${report.added === 1 ? "" : "s"}`];
  if (report.merged) parts.push(`matched ${report.merged} already in the table on another lock`);
  const issues = [...report.conflicts, ...report.errors];
  $("notice").replaceChildren(el("div", { textContent: parts.join(", ") + "." }),
    issues.length ? el("ul", {}, ...issues.map((t) => el("li", { textContent: t }))) : "");
}

function adopt(state) {
  const wasImporting = server.importing;
  for (const r of state.rows) r._id = `s${r.slot}`;
  server = state;
  render();
  if (state.importing) $("notice").replaceChildren(el("div", { textContent: `${state.progress || "Reading locks"}…` }));
  else if (wasImporting) showImport(state.imported);
  clearTimeout(pollTimer);
  // Poll only while the add-on is working; otherwise nothing changes on its own.
  if (state.syncing || state.importing) pollTimer = setTimeout(refresh, 1500);
}

async function refresh() { adopt(await api("GET", "api/state")); }

function busy(button, fn) {
  return async () => {
    button.disabled = true;
    try { await fn(); } catch (e) { alert(e.message); } finally { render(); }
  };
}

$("add").addEventListener("click", () => {
  const list = edit();
  const used = new Set(list.map((r) => r.slot));
  let slot = 1;
  while (used.has(slot)) slot++;
  list.push({ _id: `n${nextId++}`, slot, name: "", pin: "", enabled: true, notes: "",
              locks: server.locks.map((l) => l.entity), status: {} });
  render();
  $("rows").lastElementChild.querySelector("input[type=text]").focus();
});

$("discard").addEventListener("click", () => {
  draft = null; errors = {};
  $("save").disabled = $("discard").disabled = true;
  render();
});

$("save").addEventListener("click", busy($("save"), async () => {
  try {
    const state = await api("PUT", "api/codes", { rows: draft ?? [] });
    draft = null; errors = {};
    $("discard").disabled = true;
    $("notice").replaceChildren();
    adopt(state);
  } catch (e) {
    if (e.data?.errors) { errors = e.data.errors; $("save").disabled = false; return; }
    $("save").disabled = false;
    throw e;
  }
}));

$("retry").addEventListener("click", busy($("retry"), async () => adopt(await api("POST", "api/retry"))));
$("import").addEventListener("click", busy($("import"), async () => {
  if (draft && !confirm("Discard unsaved edits and import from the locks?")) return;
  draft = null;
  adopt(await api("POST", "api/import"));
}));
$("reveal").addEventListener("change", render);

// Lock configuration: read from a lock only when the section is opened.
function configLock() { return $("config-lock").value; }

function renderConfig(params) {
  const settings = params.filter((p) => p.writeable);
  const info = params.filter((p) => !p.writeable);
  const body = $("config-body");
  body.replaceChildren();
  if (!params.length) body.append(el("p", { className: "msg", textContent: "This lock reports no configuration parameters." }));
  for (const p of settings) {
    let control;
    // A small numeric range (like PIN length 4–8) reads better as a list of its values.
    const choices = p.states.length ? p.states
      : p.min != null && p.max != null && p.max - p.min <= 12
        ? Array.from({ length: p.max - p.min + 1 }, (_, i) => [p.min + i, String(p.min + i)]) : [];
    if (choices.length) {
      control = el("select", {}, ...choices.map(([v, label]) => el("option", { value: v, textContent: label, selected: v === p.value })));
      if (!choices.some(([v]) => v === p.value)) control.prepend(el("option", { value: "", textContent: "Unknown", selected: true, disabled: true }));
    } else {
      control = el("input", { type: "number", value: p.value ?? "", min: p.min ?? "", max: p.max ?? "", step: 1 });
    }
    const note = el("span", { className: "note" });
    control.addEventListener("change", async () => {
      const value = Number(control.value);
      const lock = configLock();
      if (p.pin_length && !confirm(
        `Change the PIN length on ${labelOf(lock)} to ${value} digits?\n\nEvery code on it must then be ${value} digits long, ` +
        `and the lock may erase its existing codes. Codes in the table that are ${value} digits will be written to it again; ` +
        `edit the others to ${value} digits and save.`)) { control.value = p.value; return; }
      control.disabled = true;
      note.className = "note msg"; note.textContent = "Saving…";
      try {
        const data = await api("PUT", "api/config", { lock, property: p.property, property_key: p.property_key,
                                                      endpoint: p.endpoint, value });
        renderConfig(data.params);
        refresh();
      } catch (e) {
        control.value = p.value ?? "";
        control.disabled = false;
        note.className = "note err"; note.textContent = e.message;
      }
    });
    body.append(el("div", { className: "setting" },
      el("div", { className: "what" }, el("div", { textContent: p.label }),
         p.description ? el("div", { className: "desc", textContent: p.description }) : ""),
      el("div", { className: "how" }, control, p.unit ? el("span", { className: "msg", textContent: p.unit }) : "", note)));
  }
  if (info.length) {
    body.append(el("h2", { textContent: "Lock information" }),
      el("div", { className: "info" }, ...info.map((p) => el("div", {},
        el("span", { className: "msg", textContent: p.label }),
        el("span", { textContent: p.states.find(([v]) => v === p.value)?.[1] ?? p.value ?? "—" })))));
  }
}

async function loadConfig() {
  const lock = configLock();
  if (!lock) {
    $("config-body").replaceChildren(el("p", { className: "msg", textContent: "No locks are set up yet." }));
    return;
  }
  $("config-body").replaceChildren(el("p", { className: "msg", textContent: "Reading settings…" }));
  try {
    renderConfig((await api("GET", `api/config?lock=${encodeURIComponent(lock)}`)).params);
  } catch (e) {
    $("config-body").replaceChildren(el("p", { className: "err", textContent: `Could not read settings: ${e.message}` }));
  }
}

$("config").addEventListener("toggle", async () => {
  if (!$("config").open) return;
  await loaded.catch(() => {});
  const picker = $("config-lock");
  const current = picker.value;
  picker.replaceChildren(...server.locks.map((l) => el("option", { value: l.entity, textContent: l.label,
                                                                   selected: l.entity === current })));
  $("picker").hidden = !multi();
  loadConfig();
});
$("config-lock").addEventListener("change", loadConfig);

const loaded = refresh();
loaded.catch((e) => { $("banner").textContent = e.message; });
</script>
</body>
</html>
